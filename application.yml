models:
  storage_path: models
  registry_path: null
  download:
    priority:
      - modelscope
      - hf-mirror
      - gitee
    resume: true
    timeout: 300
tts:
  default_engine: kokoro
  default_voice: af
  default_speed: 1.0
  default_pitch: 0
  default_volume: 80
  default_segment_size: "500"
  default_segment_silence_ms: 300
  default_crossfade_ms: 50
  num_to_chinese: true
  denoise: false
  denoise_level: low
asr:
  default_model: whisper-base
  default_language: zh
  auto_punctuation: true
  auto_slice: true
  default_slice_length: "30"
  denoise: false
  denoise_level: low
  default_output_format: srt
translation:
  default_engine: dict
  default_direction: zh-en
  enable_cache: true
  cache_capacity: 2000
  max_segment_chars: 0
  glossary_path: null
  target_script: none
  context_turns: 3
output:
  dir: output
  default_format: wav
  mp3_bitrate: "192"
  wav_sample_depth: "16"
log:
  level: info
  file_enabled: true
  dir: logs
  max_days: 32
ui:
  theme: light
  language: zh
  font_size: 14
task:
  max_concurrent_tts: 1
  max_concurrent_asr: 1
  retry_on_failure: true
  max_retries: 1
  persist_file: tasks.json
inference:
  num_threads: 3
  inter_threads: 0
  quantization: none
  kv_cache: true
  execution_provider: cpu
  memory_limit_mb: 2048
  enable_memory_pattern: false
  execution_mode: sequential
pipeline:
  progressive_quality: true
resource:
  max_inference_concurrency: 2
  memory_yellow_used_pct: 70.0
  memory_red_used_pct: 85.0
  enforce_limits: true