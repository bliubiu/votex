[workspace]
resolver = "2"
members = [
    "crates/votex-domain",
    "crates/votex-app",
    "crates/votex-infra",
    "crates/votex-cli",
    "crates/votex-gui",
]

[package]
name = "votex"
version.workspace = true
edition.workspace = true

[[bin]]
name = "votex"
path = "src/main.rs"

[dependencies]
votex-cli = { workspace = true }
votex-gui = { workspace = true }
anyhow = { workspace = true }
ort = { version = "2.0.0-rc.13", features = ["ndarray", "directml", "load-dynamic"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 领域层
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# 基础设施层
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

encoding_rs = "0.8"
sysinfo = "0.33"
anyhow = "1"
chrono = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# GUI
eframe = "0.31"
egui = "0.31"

regex = "1"
once_cell = "1"

# 文档解析（EPUB/DOCX/PDF）
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
pdf-extract = "0.7"

aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
half = "2.4"
sha1 = "0.10"

ctrlc = "3"



# 内部 crate
votex-domain = { path = "crates/votex-domain" }
votex-app = { path = "crates/votex-app" }
votex-infra = { path = "crates/votex-infra" }
votex-cli = { path = "crates/votex-cli" }
votex-gui = { path = "crates/votex-gui" }


