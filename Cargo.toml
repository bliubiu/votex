[workspace]
resolver = "2"
members = [
    "crates/votex-domain",
    "crates/votex-app",
    "crates/votex-infra",
    "crates/votex-cli",
    "crates/votex-gui",
]

[package]
name = "votex"
version.workspace = true
edition.workspace = true

[[bin]]
name = "votex"
path = "src/main.rs"

[dependencies]
votex-cli = { workspace = true }
votex-gui = { workspace = true }
anyhow = { workspace = true }
ort = { version = "2.0.0-rc.13", features = ["ndarray", "directml", "load-dynamic"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# ============ 发布构建优化 ============
# AGENTS.md 约束「必须编译配置优化，从源头减小体积」+「单二进制分发，不依赖外部运行时」。
# 此前完全没有 release profile 配置，发布二进制保留了全部调试符号与未优化代码。

[profile.release]
# 最小体积优先（单二进制分发场景下体积比极限性能更重要）
opt-level = "z"
# 跨 crate 链接时优化，进一步消除死代码
lto = true
# 单代码生成单元，换取更充分的优化（代价是编译变慢）
codegen-units = 1
# 剥离调试符号
strip = true
# 崩溃即终止：已确认全项目未使用 catch_unwind，
# 可安全启用并省去展开表体积；同时避免「一个线程 panic 后毒化互斥锁
# 导致连锁崩溃」这类难以诊断的半死状态
panic = "abort"

# 开发期依赖（构建脚本、过程宏）仍需快速编译，不参与最终产物体积
[profile.release.build-override]
opt-level = 0
codegen-units = 256

# 发布候选：需要定位线上问题时使用（保留符号，其余优化同 release）
[profile.release-debug]
inherits = "release"
strip = false
debug = true

[workspace.dependencies]
# 领域层
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# 基础设施层
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

encoding_rs = "0.8"
sysinfo = "0.33"
anyhow = "1"
chrono = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# GUI
eframe = "0.31"
egui = "0.31"

regex = "1"
once_cell = "1"

# 文档解析（EPUB/DOCX/PDF）
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
pdf-extract = "0.7"

aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
half = "2.4"
sha1 = "0.10"

ctrlc = "3"



# 内部 crate
votex-domain = { path = "crates/votex-domain" }
votex-app = { path = "crates/votex-app" }
votex-infra = { path = "crates/votex-infra" }
votex-cli = { path = "crates/votex-cli" }
votex-gui = { path = "crates/votex-gui" }


