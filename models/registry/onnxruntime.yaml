# ONNX Runtime 1.30 动态库（运行时依赖，非模型）
#
# 项目通过 ort crate 的 `load-dynamic` 特性在运行时加载 ONNX Runtime，
# 编译期不链接，因此本清单描述的库必须随首次启动引导下载到 models/runtime/。
# 代码读取位置见 crates/votex-infra/src/shared/ort_factory.rs。
#
# 官方仅以压缩包形式发布（Windows 为 .zip，Linux/macOS 为 .tgz），
# 因此每个文件都带 archive 段声明「从压缩包的哪个成员提取」，
# 校验值（sha256）对应**解压后的库文件**而非压缩包本身——
# 被加载执行的是前者。
#
# 三个平台的产物文件名各不相同，用 platforms 段限定，只下载当前系统所需的一份。
id: onnxruntime
name: ONNX Runtime 1.30
kind: Runtime
engine: OnnxRuntime
# 直接指定目录（不属于 tts/asr/ocr/translation 任一分类）
target_dir: runtime
files:
  # ---------- Windows x64 ----------
  - name: onnxruntime.dll
    sha256: 5e58353170677b13f05d867f93648c8783b11ac9146f330651d281701180c186
    platforms: [windows]
    required: true
    size: 18446136
    archive:
      type: zip
      member: lib/onnxruntime.dll
    sources:
      github: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-win-x64-1.30.0.zip

  # ---------- Linux x64 ----------
  # 说明：官方包内 lib/libonnxruntime.so 是指向 libonnxruntime.so.1.30.0 的符号链接，
  # 部分平台（如 Windows 上的 Git Bash tar）无法还原符号链接会产出 0 字节文件，
  # 因此 member 指向带版本号的实体文件，重命名为 libonnxruntime.so 后同样可正常加载。
  - name: libonnxruntime.so
    sha256: 245a6f8c38127551057a1cd1ffd59f0a186a227ade4f3492dea2494eb565542e
    platforms: [linux]
    required: true
    size: 28985152
    archive:
      type: targz
      member: lib/libonnxruntime.so.1.30.0
    sources:
      github: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz

  - name: libonnxruntime_providers_shared.so
    sha256: 086ec1d5388f64153d9c63470d126693db9a182c8ce236d3a1119068471b8a0d
    platforms: [linux]
    required: false
    size: 14632
    archive:
      type: targz
      member: lib/libonnxruntime_providers_shared.so
    sources:
      github: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz

  # ---------- macOS (Apple Silicon) ----------
  # 注：ORT 1.30 官方未发布 osx-x86_64 产物，Intel Mac 需自行降级版本或改用 Linux 方案
  - name: libonnxruntime.dylib
    sha256: bffaa6ef856dba2c26f09c7c0e7018fd1562625f3485292c7ad28b83748c6879
    platforms: [macos]
    required: true
    size: 43879424
    archive:
      type: targz
      member: lib/libonnxruntime.dylib
    sources:
      github: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-osx-arm64-1.30.0.tgz
