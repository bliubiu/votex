name: IndexTTS-2.5 (ONNX)
kind: Tts
engine: IndexTTS25
# 社区 fp32 ONNX 导出：https://huggingface.co/yunfengwang/IndexTTS-2.5-onnx
# 对官方 PyTorch CPU 参考实现 bit-exact（每段余弦=1.0，greedy token 逐个复现）。
# int8 不可行（动态 QInt8 翻转 GPT greedy argmax），必须保持 fp32。
# 支持语种：zh/en/ja/yue（yue=粤语，经 100 语言注册验证）。
# 注意：GPT 权重存两份（gpt_prefill/gpt_step 各带 .onnx.data），磁盘约 11.7G。
